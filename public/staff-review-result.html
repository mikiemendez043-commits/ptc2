<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Review — PTC-Catanduanes Exam System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <div class="page-header">
      <div>
        <p class="eyebrow">Student Exam Review</p>
        <h1 id="studentName">Loading...</h1>
      </div>
      <a class="button button-secondary" href="javascript:history.back()">Back</a>
    </div>

    <section class="panel-card" style="margin-bottom: 2rem;">
      <div class="grid-columns grid-3">
        <div>
          <p class="inline-note">School</p>
          <h3 id="schoolDisplay">—</h3>
        </div>
        <div>
          <p class="inline-note">Qualification</p>
          <h3 id="qualificationDisplay">—</h3>
        </div>
        <div>
          <p class="inline-note">Date Taken</p>
          <h3 id="dateDisplay">—</h3>
        </div>
        <div>
          <p class="inline-note">Age</p>
          <h3 id="ageDisplay">—</h3>
        </div>
        <div>
          <p class="inline-note">Sex</p>
          <h3 id="sexDisplay">—</h3>
        </div>
        <div>
          <p class="inline-note">Rating</p>
          <h3 id="ratingDisplay">—</h3>
        </div>
      </div>
    </section>

    <section class="panel-card">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <h2>Exam Results</h2>
        <div style="text-align: right;">
          <p class="inline-note">Score</p>
          <h2 id="scoreDisplay" style="color: var(--primary);">—</h2>
        </div>
      </div>
      <div id="answersContainer">
        <p class="inline-note">Loading answer details...</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const resultId = getQueryParam('id');

    async function loadReview() {
      if (!resultId) {
        document.body.innerHTML = '<p class="inline-note" style="padding: 2rem;">No result ID provided.</p>';
        return;
      }

      showSpinner('Loading review...');
      try {
        const result = await api.getResult(resultId);
        renderReview(result);
      } catch (error) {
        document.getElementById('answersContainer').innerHTML = `<p class="inline-note">Error loading result: ${error.message}</p>`;
      } finally {
        hideSpinner();
      }
    }

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = value == null ? '' : String(value);
      return div.innerHTML;
    }

    function renderReview(result) {
      document.getElementById('studentName').textContent = result.studentName;
      document.getElementById('schoolDisplay').textContent = result.school;
      document.getElementById('qualificationDisplay').textContent = result.qualification;
      document.getElementById('dateDisplay').textContent = formatDateLocal(result.dateTaken);
      document.getElementById('ageDisplay').textContent = result.age;
      document.getElementById('sexDisplay').textContent = result.sex;
      document.getElementById('ratingDisplay').textContent = result.rating;
      document.getElementById('scoreDisplay').textContent = `${result.score}/${result.totalItems}`;

      const answers = result.answers || [];
      if (!answers.length) {
        document.getElementById('answersContainer').innerHTML = '<p class="inline-note">No answer details were stored for this submission.</p>';
        return;
      }

      // Note: the correct answer is intentionally never shown for a missed question.
      // Only the student's own selected choice is marked - green if it was right,
      // red if it was wrong. This keeps the answer key from leaking through results review.
      const answersHtml = answers.map((answer, index) => {
        const hasSelection = Boolean(answer.selectedChoice);
        const statusLabel = !hasSelection ? 'Not Answered' : (answer.isCorrect ? '✓ Correct' : '✗ Wrong');
        const statusClass = !hasSelection ? 'wrong' : (answer.isCorrect ? 'correct' : 'wrong');
        const itemClass = !hasSelection ? 'answer-wrong' : (answer.isCorrect ? 'answer-correct' : 'answer-wrong');

        const choicesHtml = answer.choices.map(choice => {
          const isStudentChoice = choice.id === answer.selectedChoice;
          let choiceClass = 'choice-neutral';
          if (isStudentChoice) {
            choiceClass = answer.isCorrect ? 'choice-correct' : 'choice-wrong';
          }
          return `
            <div class="choice-item ${choiceClass}">
              <span class="choice-id">${escapeHtml(choice.id)}</span>
              <span class="choice-text">${escapeHtml(choice.text)}</span>
              ${isStudentChoice ? '<span class="choice-label">Student Answer</span>' : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="answer-item ${itemClass}">
            <div class="answer-header">
              <span class="answer-number">Question ${index + 1}</span>
              <span class="answer-indicator ${statusClass}">${statusLabel}</span>
            </div>
            <p class="answer-question"><strong>${escapeHtml(answer.questionText)}</strong></p>
            ${answer.imageUrl ? `<img src="${escapeHtml(answer.imageUrl)}" alt="Question image" style="max-width: 300px; margin: 0.5rem 0; border-radius: 8px;">` : ''}
            <div class="answer-choices">${choicesHtml}</div>
          </div>
        `;
      }).join('');

      document.getElementById('answersContainer').innerHTML = answersHtml;
    }

    (async function init() {
      const ok = await requireStaffSession();
      if (!ok) return;
      loadReview();
    })();
  </script>
</body>
</html>
