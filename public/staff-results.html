<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Results — PTC-Catanduanes Exam System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <div class="page-header">
      <div>
        <p class="eyebrow">Exam Results</p>
        <h1>Student Performance</h1>
      </div>
    </div>

    <section class="panel-card" style="margin-bottom: 1.5rem;">
      <div class="toolbar">
        <div class="flex-gap-center">
          <div class="form-field" style="margin:0;">
            <select id="monthSelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;"></select>
          </div>
          <div class="form-field" style="margin:0;">
            <select id="yearSelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;"></select>
          </div>
        </div>
        <button id="exportCsv" class="button button-secondary" type="button">Export CSV</button>
      </div>
      <div class="grid-columns grid-2" style="align-items: start; gap: 1.5rem;">
        <div class="card" style="padding: 1rem;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:0.75rem;">
            <h2 style="margin:0;">Rating distribution</h2>
            <span id="periodLabel" style="font-size:0.85rem; color:var(--text-muted); font-weight:600;"></span>
          </div>
          <div style="display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap; margin-top:0.75rem;">
            <canvas id="ratingChart" width="240" height="240" style="width:180px; height:180px; flex-shrink:0;"></canvas>
            <div id="chartLegend" style="flex:1; min-width:130px; display:flex; flex-direction:column; gap:0.45rem;"></div>
          </div>
        </div>
        <div class="card" style="padding: 1rem;">
          <h2>Summary</h2>
          <p id="summaryText" class="inline-note" style="margin-top: 0.8rem;"></p>
          <div id="testDetailSummary" style="margin-top:1rem;"></div>
        </div>
      </div>
    </section>

    <section class="table-card">
      <div class="toolbar">
        <div>
          <input id="searchBox" class="search-input" type="search" placeholder="Search by name, qualification, or rating" />
        </div>
        <div class="inline-note" id="resultCount"></div>
      </div>
      <div id="resultsTable"><p class="inline-note">Loading...</p></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const ratingChart = document.getElementById('ratingChart');
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const periodLabel = document.getElementById('periodLabel');
    const summaryText = document.getElementById('summaryText');
    const searchBox = document.getElementById('searchBox');
    const resultsTable = document.getElementById('resultsTable');
    const resultCount = document.getElementById('resultCount');
    const exportCsv = document.getElementById('exportCsv');
    const examType = getQueryParam('type') || 'OLT01';
    let allResults = [];
    let searchTerm = '';

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    // ── Rating legend colour map ──────────────────────────────────────────────
    const RATING_LEGEND = [
      { label: 'Very Poor',  color: '#a4a6ff' },
      { label: 'Poor',       color: '#f97316' },
      { label: 'Fair',       color: '#fbbf24' },
      { label: 'Good',       color: '#22c55e' },
      { label: 'Very Good',  color: '#38bdf8' },
      { label: 'Excellent',  color: '#16a34a' },
    ];

    function initSelectors() {
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      monthSelect.innerHTML = MONTHS.map((m, i) =>
        `<option value="${i}" ${i === currentMonth ? 'selected' : ''}>${m}</option>`
      ).join('');

      const years = [];
      for (let y = currentYear; y >= currentYear - 5; y--) years.push(y);
      yearSelect.innerHTML = years.map(y =>
        `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}</option>`
      ).join('');
    }

    function getSelectedPeriod() {
      return { month: parseInt(monthSelect.value), year: parseInt(yearSelect.value) };
    }

    monthSelect.addEventListener('change', renderSummary);
    yearSelect.addEventListener('change', renderSummary);

    function getFilteredResults() {
      const { month, year } = getSelectedPeriod();
      const periodResults = allResults.filter(item => {
        const d = new Date(item.dateTaken);
        return d.getFullYear() === year && d.getMonth() === month;
      });
      if (!searchTerm) return periodResults;
      const lower = searchTerm.toLowerCase();
      return periodResults.filter(item =>
        item.studentName.toLowerCase().includes(lower) ||
        item.qualification.toLowerCase().includes(lower) ||
        item.rating.toLowerCase().includes(lower)
      );
    }

    function requiredCountFor(type) {
      const counts = { OLT01: 35, TLT01: 35, TNT01: 30 };
      return counts[type] || 0;
    }

    function renderSummary() {
      const filtered = getFilteredResults();
      const slices = drawRatingPieChart(ratingChart, filtered);
      renderChartLegend(filtered);
      renderTestDetailSummary(filtered);
      const { month, year } = getSelectedPeriod();
      const pLabel = `${MONTHS[month]} ${year}`;
      if (periodLabel) periodLabel.textContent = pLabel;
      const total = filtered.length;
      const average = total ? (filtered.reduce((sum, item) => sum + item.score, 0) / total).toFixed(1) : '0.0';
      const topRating = getMostCommonRating(filtered);
      const commonText = topRating ? `${topRating[0]} (${topRating[1]} student${topRating[1] === 1 ? '' : 's'})` : 'No results';
      summaryText.textContent = `${total} student${total === 1 ? '' : 's'} took ${examType} in ${pLabel}. Average score: ${average}/${requiredCountFor(examType)}. Most common rating: ${commonText}.`;
      resultCount.textContent = `${filtered.length} record${filtered.length === 1 ? '' : 's'}`;
      renderTable(filtered);
    }

    // ── Legend — always show ALL 6 ratings with counts (0 if none) ────────────
    function renderChartLegend(filtered) {
      const legendEl = document.getElementById('chartLegend');
      if (!legendEl) return;
      const total = filtered.length;
      legendEl.innerHTML = RATING_LEGEND.map(entry => {
        const count   = filtered.filter(r => r.rating === entry.label).length;
        const percent = total ? ((count / total) * 100).toFixed(1) : '0.0';
        const muted   = count === 0 ? 'opacity:0.45;' : '';
        return `
          <div style="display:flex;align-items:center;gap:0.55rem;font-size:0.82rem;color:var(--text);${muted}">
            <span style="display:inline-block;width:13px;height:13px;border-radius:3px;background:${entry.color};flex-shrink:0;"></span>
            <span style="flex:1;">${entry.label}</span>
            <span style="font-weight:700;color:var(--primary);">${percent}%</span>
            <span style="color:var(--text-muted);">(${count})</span>
          </div>`;
      }).join('');
    }

    // ── Test detail summary — no age group; clickable Needs Review ────────────
    function renderTestDetailSummary(filtered) {
      const container = document.getElementById('testDetailSummary');
      if (!container) return;
      if (!filtered.length) { container.innerHTML = ''; return; }

      const males   = filtered.filter(r => r.sex && r.sex.toLowerCase() === 'male').length;
      const females = filtered.filter(r => r.sex && r.sex.toLowerCase() === 'female').length;
      const other   = filtered.length - males - females;

      const schoolTally = {};
      filtered.forEach(r => { if (r.school) schoolTally[r.school] = (schoolTally[r.school] || 0) + 1; });
      const topSchoolEntry = Object.entries(schoolTally).sort((a, b) => b[1] - a[1])[0];
      const topSchool = topSchoolEntry ? `${topSchoolEntry[0]} (${topSchoolEntry[1]})` : '—';

      const passed       = filtered.filter(r => ['Excellent','Very Good','Good'].includes(r.rating));
      const needsReview  = filtered.filter(r => !['Excellent','Very Good','Good'].includes(r.rating));

      const scores   = filtered.map(r => r.score);
      const highScore = Math.max(...scores);
      const lowScore  = Math.min(...scores);

      const pill = (val, color, clickable = false, id = '') =>
        `<span ${clickable ? `id="${id}" role="button" tabindex="0" title="Click to see list"` : ''}
          style="display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:20px;
                 font-size:0.78rem;font-weight:700;background:${color}22;color:${color};
                 ${clickable ? 'cursor:pointer;border:1.5px solid ' + color + '44;user-select:none;' : ''}">
          ${val}${clickable ? ' <span style="font-size:0.7rem;">▾</span>' : ''}
        </span>`;

      container.innerHTML = `
        <div style="border-top:1px solid var(--border);padding-top:0.9rem;">
          <p style="margin:0 0 0.6rem;font-size:0.82rem;font-weight:700;text-transform:uppercase;
                    letter-spacing:0.07em;color:var(--text-muted);">Test Detail — ${examType}</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.55rem 1rem;">

            <div style="font-size:0.83rem;">
              <span style="color:var(--text-muted);">Gender</span><br>
              ${pill(males + ' Male','#38bdf8')}
              ${pill(females + ' Female','#f472b6')}
              ${other ? pill(other + ' Other','#a3a3a3') : ''}
            </div>

            <div style="font-size:0.83rem;">
              <span style="color:var(--text-muted);">Result</span><br>
              ${pill(passed.length + ' Passed','#16a34a', true, 'pillPassed')}
              ${pill(needsReview.length + ' Needs Review','#d97706', true, 'pillNeeds')}
            </div>

            <div style="font-size:0.83rem;margin-top:0.35rem;">
              <span style="color:var(--text-muted);">Score range</span><br>
              <span style="color:var(--text);">High&nbsp;<b>${highScore}</b> &nbsp;·&nbsp; Low&nbsp;<b>${lowScore}</b></span>
            </div>

            <div style="font-size:0.83rem;margin-top:0.35rem;">
              <span style="color:var(--text-muted);">Top school</span><br>
              <b>${topSchool}</b>
            </div>

          </div>

          <!-- Expandable student list panel -->
          <div id="reviewListPanel" style="display:none;margin-top:0.9rem;border-radius:10px;
               border:1px solid var(--border);overflow:hidden;">
            <div id="reviewListHeader" style="padding:0.5rem 0.85rem;font-size:0.8rem;font-weight:700;
                 background:var(--surface-strong);display:flex;justify-content:space-between;align-items:center;">
              <span id="reviewListTitle"></span>
              <button id="reviewListClose" type="button"
                style="background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-muted);padding:0;">✕</button>
            </div>
            <ul id="reviewListItems" style="margin:0;padding:0.5rem 0;list-style:none;max-height:160px;overflow-y:auto;"></ul>
          </div>
        </div>`;

      // Attach click handlers for the pills
      attachPillListeners(passed, needsReview);
    }

    function attachPillListeners(passed, needsReview) {
      const panel      = document.getElementById('reviewListPanel');
      const title      = document.getElementById('reviewListTitle');
      const items      = document.getElementById('reviewListItems');
      const closeBtn   = document.getElementById('reviewListClose');
      const pillPassed = document.getElementById('pillPassed');
      const pillNeeds  = document.getElementById('pillNeeds');
      if (!panel || !pillPassed || !pillNeeds) return;

      function showList(label, color, students) {
        title.textContent = label;
        title.style.color = color;
        if (!students.length) {
          items.innerHTML = `<li style="padding:0.4rem 0.85rem;font-size:0.82rem;color:var(--text-muted);">No students in this group.</li>`;
        } else {
          items.innerHTML = students.map((s, i) => `
            <li style="padding:0.35rem 0.85rem;font-size:0.82rem;display:flex;align-items:center;gap:0.6rem;
                       ${i % 2 === 0 ? 'background:var(--surface-strong);' : ''}">
              <span style="font-weight:700;color:${color};min-width:1.4rem;">${i + 1}.</span>
              <span style="flex:1;">${s.studentName}</span>
              <span style="color:var(--text-muted);font-size:0.77rem;">${s.rating}</span>
              <span style="color:var(--text-muted);font-size:0.77rem;">${s.score}/${s.totalItems}</span>
            </li>`).join('');
        }
        panel.style.display = 'block';
      }

      let lastClicked = null;
      function toggle(key, label, color, students) {
        if (panel.style.display === 'block' && lastClicked === key) {
          panel.style.display = 'none';
          lastClicked = null;
        } else {
          showList(label, color, students);
          lastClicked = key;
        }
      }

      pillPassed.addEventListener('click', () => toggle('passed', '✅ Passed Students', '#16a34a', passed));
      pillPassed.addEventListener('keydown', e => { if (e.key === 'Enter') pillPassed.click(); });
      pillNeeds.addEventListener('click',  () => toggle('needs',  '⚠️ Needs Review', '#d97706', needsReview));
      pillNeeds.addEventListener('keydown', e => { if (e.key === 'Enter') pillNeeds.click(); });
      closeBtn.addEventListener('click', () => { panel.style.display = 'none'; lastClicked = null; });
    }

    function renderTable(results) {
      if (!results.length) {
        resultsTable.innerHTML = '<p class="inline-note">No results match the selected period or search term.</p>';
        return;
      }
      const rows = results.map(item => `
        <tr>
          <td>${item.school}</td>
          <td>${item.qualification}</td>
          <td>${item.studentName}</td>
          <td>${item.age}</td>
          <td>${item.sex}</td>
          <td>${item.score}/${item.totalItems}</td>
          <td>${item.rating}</td>
          <td>${formatDateLocal(item.dateTaken)}</td>
          <td>
            <div class="row-menu">
              <button class="row-menu-trigger" type="button" data-menu-toggle data-id="${item.id}" aria-haspopup="true" aria-expanded="false" aria-label="Actions for ${item.studentName}">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="9" cy="3.5" r="1.5" fill="currentColor"/>
                  <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
                  <circle cx="9" cy="14.5" r="1.5" fill="currentColor"/>
                </svg>
              </button>
              <div class="row-menu-dropdown" data-menu-dropdown data-id="${item.id}">
                <button class="row-menu-item" type="button" data-action="edit" data-id="${item.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  </svg>
                  Edit
                </button>
                <div class="row-menu-divider"></div>
                <button class="row-menu-item danger" type="button" data-action="delete" data-id="${item.id}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 7h16M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7m2 0-.7 12.1a2 2 0 0 1-2 1.9H9.7a2 2 0 0 1-2-1.9L7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>
      `).join('');
      resultsTable.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>School</th>
              <th>Qualification</th>
              <th>Name</th>
              <th>Age</th>
              <th>Sex</th>
              <th>Score</th>
              <th>Rating</th>
              <th>Date Taken</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      resultsTable.querySelectorAll('[data-menu-toggle]').forEach(trigger => {
        trigger.addEventListener('click', event => {
          event.stopPropagation();
          const id = trigger.getAttribute('data-id');
          const dropdown = resultsTable.querySelector(`.row-menu-dropdown[data-id="${id}"]`);
          const isOpen = dropdown.classList.contains('open');
          closeAllMenus();
          if (!isOpen) {
            dropdown.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
          }
        });
      });

      resultsTable.querySelectorAll('button[data-action]').forEach(button => {
        button.addEventListener('click', async event => {
          event.stopPropagation();
          closeAllMenus();
          const id = button.getAttribute('data-id');
          const action = button.getAttribute('data-action');
          if (action === 'delete') {
            const confirmed = window.confirm('Delete this student result permanently?');
            if (!confirmed) return;
            try {
              await api.deleteResult(id);
              allResults = allResults.filter(item => item.id !== id);
              renderSummary();
            } catch (error) {
              alert(error.message);
            }
            return;
          }
          if (action === 'edit') {
            await openEditor(id);
          }
        });
      });
    }

    function closeAllMenus() {
      resultsTable.querySelectorAll('.row-menu-dropdown.open').forEach(dropdown => dropdown.classList.remove('open'));
      resultsTable.querySelectorAll('[data-menu-toggle][aria-expanded="true"]').forEach(trigger => trigger.setAttribute('aria-expanded', 'false'));
    }

    document.addEventListener('click', closeAllMenus);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeAllMenus();
    });

    async function openEditor(resultId) {
      const result = allResults.find(item => item.id === resultId);
      if (!result) return;
      const name = window.prompt('Edit student name', result.studentName);
      if (name === null) return;
      const age = window.prompt('Edit age', String(result.age));
      if (age === null) return;
      const sex = window.prompt('Edit sex (Male/Female)', result.sex);
      if (sex === null) return;
      const qualification = window.prompt('Edit qualification', result.qualification);
      if (qualification === null) return;

      const answers = [];
      for (const item of result.answers || []) {
        const current = item.selectedChoice || '';
        const answerInput = window.prompt(`Edit answer for: ${item.questionText}\nCurrent: ${current || 'No answer'}\nEnter A, B, C, D, or leave blank`, current);
        if (answerInput === null) return;
        const normalized = (answerInput || '').trim().toUpperCase();
        answers.push({
          questionId: item.questionId,
          selectedChoice: ['A', 'B', 'C', 'D'].includes(normalized) ? normalized : null
        });
      }

      const payload = {
        studentName: name.trim(),
        age: Number(age),
        sex,
        qualification,
        answers
      };
      try {
        const updated = await api.updateResult(resultId, payload);
        const index = allResults.findIndex(item => item.id === resultId);
        if (index >= 0) allResults[index] = updated;
        renderSummary();
        alert('Result updated successfully.');
      } catch (error) {
        alert(error.message);
      }
    }

    searchBox.addEventListener('input', () => {
      searchTerm = searchBox.value.trim();
      renderSummary();
    });

    exportCsv.addEventListener('click', () => {
      const filtered = getFilteredResults();
      if (!filtered.length) {
        alert('No rows available for export.');
        return;
      }
      downloadCSV(`${examType}-results.csv`, filtered);
    });

    (async function init() {
      const ok = await requireStaffSession();
      if (!ok) return;
      renderStaffNav('results');
      initSelectors();
      try {
        allResults = await api.getResults(examType);
      } catch (error) {
        resultsTable.innerHTML = `<p class="inline-note">Failed to load results: ${error.message}</p>`;
        return;
      }
      renderSummary();
    })();
  </script>
</body>
</html>
