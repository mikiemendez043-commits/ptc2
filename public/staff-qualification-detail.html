<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualification Detail — TCAT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <div class="page-header">
      <div>
        <p class="eyebrow">Students by Qualification</p>
        <h1 id="qualificationTitle">Loading...</h1>
      </div>
      <a class="button button-secondary" href="staff-dashboard.html">Back to Dashboard</a>
    </div>

    <section class="table-card">
      <div class="flex-gap-center" style="justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;">
        <p class="inline-note" id="qualificationSubtitle" style="margin:0;"></p>
        <div class="flex-gap-center" style="gap:0.6rem; flex-wrap: wrap;">
          <div class="form-field" style="margin:0;">
            <select id="filterTypeSelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;">
              <option value="all">All time</option>
              <option value="week">Specific week</option>
              <option value="month">Specific month</option>
              <option value="year">Specific year</option>
            </select>
          </div>
          <div class="form-field" id="weekFilterWrap" style="margin:0; display:none;">
            <input type="week" id="weekFilterInput" class="search-input" style="width:auto; font-size:0.88rem; padding:5px 10px;">
          </div>
          <div class="form-field flex-gap-center" id="monthFilterWrap" style="margin:0; display:none; gap:0.4rem;">
            <select id="monthSelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;"></select>
            <select id="monthYearSelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;"></select>
          </div>
          <div class="form-field" id="yearFilterWrap" style="margin:0; display:none;">
            <select id="yearOnlySelect" class="search-input" style="width:auto; font-size:0.88rem; padding:6px 10px;"></select>
          </div>
          <button class="button button-ghost" id="clearFilterButton" type="button" style="padding:6px 14px; font-size:0.85rem;">Clear</button>
          <button class="button button-secondary" id="toggleSelectButton" type="button" style="padding:6px 14px; font-size:0.85rem;">Select</button>
        </div>
      </div>
      <p class="inline-note" style="margin-bottom:1rem;">Click a student's score to review that exam question-by-question. Use <strong>Select</strong> to choose students and generate a Word document of their results.</p>
      <div id="detailContent"><p class="inline-note">Loading...</p></div>
      <div class="selection-toolbar" id="selectionToolbar" style="display:none;">
        <span id="selectionCount">0 students selected</span>
        <div class="flex-gap">
          <button class="button button-ghost toolbar-cancel" id="clearSelectionButton" type="button">Clear</button>
          <button class="button button-secondary" id="generateDocxButton" type="button" disabled>Generate Word Document</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="exportProgressOverlay">
    <div class="modal-box" style="width:min(420px,100%);" role="dialog" aria-modal="true" aria-labelledby="exportProgressTitle">
      <div class="modal-header" style="border-bottom:none; padding-bottom:0;">
        <div>
          <h3 id="exportProgressTitle">Generating Word Document</h3>
        </div>
      </div>
      <div class="modal-body" style="padding-top:0.5rem;">
        <div class="progress-line-track">
          <div class="progress-line-fill" id="exportProgressFill" style="width:0%;"></div>
        </div>
        <div class="flex-gap-center" style="justify-content: space-between; margin-top:0.6rem;">
          <p class="inline-note" id="exportProgressStatus" style="margin:0;">Gathering selected results...</p>
          <span id="exportProgressPercent" style="font-weight:700; color:var(--primary); font-size:0.9rem;">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const qualificationTitle = document.getElementById('qualificationTitle');
    const qualificationSubtitle = document.getElementById('qualificationSubtitle');
    const detailContent = document.getElementById('detailContent');

    const filterTypeSelect = document.getElementById('filterTypeSelect');
    const weekFilterWrap = document.getElementById('weekFilterWrap');
    const weekFilterInput = document.getElementById('weekFilterInput');
    const monthFilterWrap = document.getElementById('monthFilterWrap');
    const monthSelect = document.getElementById('monthSelect');
    const monthYearSelect = document.getElementById('monthYearSelect');
    const yearFilterWrap = document.getElementById('yearFilterWrap');
    const yearOnlySelect = document.getElementById('yearOnlySelect');
    const clearFilterButton = document.getElementById('clearFilterButton');
    const toggleSelectButton = document.getElementById('toggleSelectButton');
    const selectionToolbar = document.getElementById('selectionToolbar');
    const selectionCount = document.getElementById('selectionCount');
    const clearSelectionButton = document.getElementById('clearSelectionButton');
    const generateDocxButton = document.getElementById('generateDocxButton');

    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    let qualification = null;
    let examTypes = [];
    let detailData = null; // cached fetch result, so filtering never re-fetches

    // Selection state for bulk Word-document export. Keyed by studentName —
    // safe because a student's name is unique within a single qualification
    // (enforced by the DB's unique index on examType+name+qualification).
    let selectMode = false;
    let selectedNames = new Set();

    function yearRange() {
      const now = new Date();
      const years = [];
      for (let y = now.getFullYear(); y >= now.getFullYear() - 5; y--) years.push(y);
      return years;
    }

    // Returns the ISO week string (e.g. "2026-W27") for right now, used as the
    // default value so the week picker opens on something relevant.
    function getCurrentISOWeekString() {
      const now = new Date();
      const target = new Date(now.valueOf());
      const dayNr = (now.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
      }
      const week = 1 + Math.ceil((firstThursday - target) / (7 * 24 * 3600 * 1000));
      return `${now.getFullYear()}-W${String(week).padStart(2, '0')}`;
    }

    // Converts an ISO week string ("YYYY-Www") into the [start, end) Date
    // range it covers, using the standard ISO 8601 definition (weeks start
    // Monday, week 1 is the week containing the year's first Thursday).
    function getISOWeekRange(weekValue) {
      const [yearPart, weekPart] = weekValue.split('-W');
      const year = Number(yearPart);
      const week = Number(weekPart);
      const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
      const dow = simple.getUTCDay();
      const start = new Date(simple);
      if (dow <= 4) {
        start.setUTCDate(simple.getUTCDate() - dow + 1);
      } else {
        start.setUTCDate(simple.getUTCDate() + 8 - dow);
      }
      const end = new Date(start);
      end.setUTCDate(start.getUTCDate() + 7);
      return { start, end };
    }

    function populateFilterOptions() {
      const now = new Date();

      monthSelect.innerHTML = MONTHS.map((m, i) => `<option value="${i}">${m}</option>`).join('');
      monthSelect.value = String(now.getMonth());

      const years = yearRange();
      monthYearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
      monthYearSelect.value = String(now.getFullYear());

      yearOnlySelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
      yearOnlySelect.value = String(now.getFullYear());

      weekFilterInput.value = getCurrentISOWeekString();
    }

    function updateFilterVisibility() {
      const type = filterTypeSelect.value;
      weekFilterWrap.style.display = type === 'week' ? 'flex' : 'none';
      monthFilterWrap.style.display = type === 'month' ? 'flex' : 'none';
      yearFilterWrap.style.display = type === 'year' ? 'flex' : 'none';
    }

    function getCurrentFilter() {
      const type = filterTypeSelect.value;
      if (type === 'week') {
        return { type, week: weekFilterInput.value };
      }
      if (type === 'month') {
        return { type, month: Number(monthSelect.value), year: Number(monthYearSelect.value) };
      }
      if (type === 'year') {
        return { type, year: Number(yearOnlySelect.value) };
      }
      return { type: 'all' };
    }

    function studentMatchesFilter(student, filter) {
      if (filter.type === 'all') return true;
      return examTypes.some(type => {
        const r = student.results[type];
        if (!r || !r.dateTaken) return false;
        const d = new Date(r.dateTaken);
        if (filter.type === 'week') {
          if (!filter.week) return false;
          const { start, end } = getISOWeekRange(filter.week);
          return d >= start && d < end;
        }
        if (filter.type === 'month') {
          return d.getFullYear() === filter.year && d.getMonth() === filter.month;
        }
        if (filter.type === 'year') {
          return d.getFullYear() === filter.year;
        }
        return false;
      });
    }

    function escapeAttr(value) {
      return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function renderTable() {
      if (!detailData) return;
      const filter = getCurrentFilter();
      const students = detailData.students.filter(s => studentMatchesFilter(s, filter));

      if (!students.length) {
        detailContent.innerHTML = '<p class="inline-note">No students match this filter.</p>';
        renderSelectionToolbar();
        return;
      }

      detailContent.innerHTML = `
        <table>
          <thead>
            <tr>
              ${selectMode ? '<th style="width:2.5rem;"><input type="checkbox" class="select-checkbox" id="selectAllCheckbox" aria-label="Select all visible students"></th>' : ''}
              <th>Name</th>
              <th>Age</th>
              <th>Sex</th>
              ${examTypes.map(type => `<th>${type}</th>`).join('')}
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${students.map((student, index) => `
              <tr data-student-index="${index}">
                ${selectMode ? `<td><input type="checkbox" class="select-checkbox" data-student-name="${escapeAttr(student.studentName)}" ${selectedNames.has(student.studentName) ? 'checked' : ''} aria-label="Select ${escapeAttr(student.studentName)}"></td>` : ''}
                <td>${student.studentName}</td>
                <td>${student.age}</td>
                <td>${student.sex}</td>
                ${examTypes.map(type => {
                  const r = student.results[type];
                  if (!r) return '<td class="inline-note">Not taken</td>';
                  return `<td><button class="link-button" type="button" data-review-id="${r.id}" title="Review this exam question-by-question">${r.score}/${r.totalItems} (${r.rating})</button></td>`;
                }).join('')}
                <td>
                  <button class="button button-danger delete-student-row" type="button" data-student-index="${index}" style="padding:0.4rem 0.8rem; font-size:0.82rem;">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      // "Review" — opens the shared per-question review modal (defined in app.js).
      detailContent.querySelectorAll('[data-review-id]').forEach(button => {
        button.addEventListener('click', () => openReviewModal(button.getAttribute('data-review-id')));
      });

      // Selection checkboxes (only present in select mode).
      if (selectMode) {
        const visibleNames = students.map(s => s.studentName);
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = visibleNames.length > 0 && visibleNames.every(name => selectedNames.has(name));
          selectAllCheckbox.addEventListener('change', () => {
            if (selectAllCheckbox.checked) {
              visibleNames.forEach(name => selectedNames.add(name));
            } else {
              visibleNames.forEach(name => selectedNames.delete(name));
            }
            renderTable();
          });
        }
        detailContent.querySelectorAll('.select-checkbox[data-student-name]').forEach(checkbox => {
          checkbox.addEventListener('change', () => {
            const name = checkbox.getAttribute('data-student-name');
            if (checkbox.checked) selectedNames.add(name); else selectedNames.delete(name);
            renderSelectionToolbar();
          });
        });
      }

      detailContent.querySelectorAll('.delete-student-row').forEach(button => {
        button.addEventListener('click', async () => {
          const student = students[Number(button.dataset.studentIndex)];
          const resultIds = examTypes.map(type => student.results[type] && student.results[type].id).filter(Boolean);
          if (!resultIds.length) return;

          const confirmMessage = `Delete all ${resultIds.length} exam result${resultIds.length === 1 ? '' : 's'} for ${student.studentName}? This cannot be undone.`;
          if (!confirm(confirmMessage)) return;

          button.disabled = true;
          button.textContent = 'Deleting...';
          try {
            for (const id of resultIds) {
              await api.deleteResult(id);
            }
            selectedNames.delete(student.studentName);
            detailData = await api.getQualificationDetail(qualification);
            renderTable();
          } catch (error) {
            alert(`Failed to delete: ${error.message}`);
            button.disabled = false;
            button.textContent = 'Delete';
          }
        });
      });

      renderSelectionToolbar();
    }

    // ── Select mode: toggle, toolbar, and Word-document generation ──────────
    function renderSelectionToolbar() {
      if (!selectMode) {
        selectionToolbar.style.display = 'none';
        return;
      }
      selectionToolbar.style.display = 'flex';
      const count = selectedNames.size;
      selectionCount.textContent = `${count} student${count === 1 ? '' : 's'} selected`;
      generateDocxButton.disabled = count === 0;
    }

    toggleSelectButton.addEventListener('click', () => {
      selectMode = !selectMode;
      if (!selectMode) selectedNames.clear();
      toggleSelectButton.textContent = selectMode ? 'Cancel Select' : 'Select';
      toggleSelectButton.classList.toggle('button-primary', selectMode);
      toggleSelectButton.classList.toggle('button-secondary', !selectMode);
      renderTable();
    });

    clearSelectionButton.addEventListener('click', () => {
      selectedNames.clear();
      renderTable();
    });

    const exportProgressOverlay = document.getElementById('exportProgressOverlay');
    const exportProgressStatus = document.getElementById('exportProgressStatus');
    const exportProgressFill = document.getElementById('exportProgressFill');
    const exportProgressPercent = document.getElementById('exportProgressPercent');
    const EXPORT_PROGRESS_MESSAGES = [
      'Gathering selected results...',
      'Loading question images...',
      'Formatting the document...',
      'Almost done...'
    ];

    // There's no live progress stream from the server (it's a single
    // request/response), so this is a simulated percentage: it climbs
    // quickly at first then slows down, capped at 90% until the file is
    // actually ready — it never claims 100% before the download is real.
    function openExportProgress() {
      const state = { percent: 0, timer: null };
      exportProgressStatus.textContent = EXPORT_PROGRESS_MESSAGES[0];
      exportProgressFill.style.width = '0%';
      exportProgressPercent.textContent = '0%';
      exportProgressOverlay.classList.add('open');

      state.timer = setInterval(() => {
        const remaining = 90 - state.percent;
        state.percent = Math.min(90, state.percent + Math.max(remaining * 0.08, 0.6));
        exportProgressFill.style.width = `${state.percent}%`;
        exportProgressPercent.textContent = `${Math.round(state.percent)}%`;

        if (state.percent < 25) exportProgressStatus.textContent = EXPORT_PROGRESS_MESSAGES[0];
        else if (state.percent < 55) exportProgressStatus.textContent = EXPORT_PROGRESS_MESSAGES[1];
        else if (state.percent < 85) exportProgressStatus.textContent = EXPORT_PROGRESS_MESSAGES[2];
        else exportProgressStatus.textContent = EXPORT_PROGRESS_MESSAGES[3];
      }, 200);

      return state;
    }

    // Success path: snap the bar to 100% / "Done!" briefly so it reads as
    // complete, then close.
    function completeExportProgress(state) {
      clearInterval(state.timer);
      exportProgressFill.style.width = '100%';
      exportProgressPercent.textContent = '100%';
      exportProgressStatus.textContent = 'Done!';
      setTimeout(() => exportProgressOverlay.classList.remove('open'), 500);
    }

    // Failure path: just close, no false "100% done".
    function cancelExportProgress(state) {
      clearInterval(state.timer);
      exportProgressOverlay.classList.remove('open');
    }

    generateDocxButton.addEventListener('click', async () => {
      if (!selectedNames.size || !detailData) return;

      const resultIds = [];
      detailData.students.forEach(student => {
        if (!selectedNames.has(student.studentName)) return;
        examTypes.forEach(type => {
          const r = student.results[type];
          if (r && r.id) resultIds.push(r.id);
        });
      });

      if (!resultIds.length) {
        alert('The selected students have no completed exam results to export.');
        return;
      }

      setButtonLoading(generateDocxButton, true, 'Generating...');
      const progress = openExportProgress();
      try {
        const blob = await api.exportResultsToDocx(resultIds);
        const safeQualification = qualification.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
        downloadBlob(`${safeQualification}-exam-review.docx`, blob);
        completeExportProgress(progress);
      } catch (error) {
        cancelExportProgress(progress);
        alert(error.message);
      } finally {
        setButtonLoading(generateDocxButton, false);
      }
    });

    filterTypeSelect.addEventListener('change', () => {
      updateFilterVisibility();
      renderTable();
    });
    weekFilterInput.addEventListener('change', renderTable);
    monthSelect.addEventListener('change', renderTable);
    monthYearSelect.addEventListener('change', renderTable);
    yearOnlySelect.addEventListener('change', renderTable);

    clearFilterButton.addEventListener('click', () => {
      filterTypeSelect.value = 'all';
      updateFilterVisibility();
      renderTable();
    });

    (async function init() {
      const ok = await requireStaffSession();
      if (!ok) return;
      renderStaffNav('qualification-detail');

      qualification = getQueryParam('qualification');
      if (!qualification) {
        detailContent.innerHTML = '<p class="inline-note">No qualification specified.</p>';
        return;
      }

      qualificationTitle.textContent = qualification;
      qualificationSubtitle.textContent = 'Every student who has attempted this qualification, with their score on each exam.';
      populateFilterOptions();
      updateFilterVisibility();

      const config = await api.getConfig();
      examTypes = config.examTypes;

      showSpinner('Loading student details...');
      try {
        detailData = await api.getQualificationDetail(qualification);
        renderTable();
      } catch (error) {
        detailContent.innerHTML = `<p class="inline-note">Failed to load details: ${error.message}</p>`;
      } finally {
        hideSpinner();
      }
    })();
  </script>
</body>
</html>
